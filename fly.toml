app = "fleet-api"
primary_region = "nrt"

# Fly stops a machine by sending its stop signal (SIGINT by default) and then
# SIGKILL after kill_timeout. fleetd drains in-flight requests for up to 10s
# (shutdownTimeout in cmd/fleetd/main.go), so keep this comfortably above that
# or the graceful drain is cut short.
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Fly terminates TLS and proxies requests to the app; TRUST_PROXY tells
  # fleetd to derive the client IP from the Fly-Client-IP / X-Forwarded-For
  # headers instead of the proxy's own connection address. Without this,
  # per-IP rate limiting on /auth treats every request as coming from the
  # same address and collapses.
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
