name: desktop
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Package main embeds frontend/dist and links wails, which is cgo/GTK on
      # Linux. The tag matches the one release.yml builds with.
      GOFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-tags=webkit2_41' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Linux webkit deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        # main.go embeds frontend/dist, which is gitignored: without this every
        # Go command that compiles package main fails on a fresh checkout.
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
