name: pages
on:
  push:
    branches: ["master"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Publish the landing page in site/ to GitHub Pages. Enable once under repo
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
