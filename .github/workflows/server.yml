name: server
on:
  push:
    paths:
      - "cmd/fleetd/**"
      - "internal/server/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/server.yml"
    tags: ["server-v*"]
  pull_request:
    paths:
      - "cmd/fleetd/**"
      - "internal/server/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/fleet_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build server binary
        run: go build ./cmd/fleetd
      - name: Vet server packages
        run: go vet ./cmd/fleetd/... ./internal/server/...
      - name: Check gofmt
        run: |
          fmt_out=$(gofmt -l ./cmd/fleetd ./internal/server)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Test server packages
        run: go test ./cmd/fleetd/... ./internal/server/...

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
