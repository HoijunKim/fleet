name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/desktop.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          # macos-13 (Intel), not macos-latest: on macOS 14+ arm64 runners the
          # go-installed wails CLI aborts with "missing LC_UUID" under the newer
          # dyld. macos-13's dyld does not enforce it, and darwin/universal still
          # builds (wails lipo-combines both arches).
          - os: macos-13
            platform: darwin/universal
          - os: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install Linux webkit deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      # The version a binary reports is the tag it was cut from: github.ref_name
      # is the only source, so there is no second place to bump.
      - name: Build
        run: >
          wails build -tags webkit2_41 -platform ${{ matrix.platform }}
          -ldflags "-X github.com/hoijun/fleet/internal/buildinfo.version=${{ github.ref_name }}
          -X github.com/hoijun/fleet/internal/buildinfo.commit=${{ github.sha }}
          -X github.com/hoijun/fleet/internal/buildinfo.date=${{ github.event.head_commit.timestamp }}"
      - name: Package macOS app
        if: matrix.os == 'macos-13'
        run: |
          ditto -c -k --keepParent build/bin/fleet.app build/bin/fleet-macos.zip
          rm -rf build/bin/fleet.app
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.os }}
          path: build/bin/*
          if-no-files-found: error

  # One job publishes, so the release body is written exactly once. Three build
  # jobs racing on the same release would each PATCH it, and whichever landed
  # last would decide what the notes say.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # index() rather than a regex: the heading contains [ and ], and building
      # a dynamic regex around them needs escaping that differs between awks.
      - name: Extract release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            BEGIN { head = "## [" ver "]" }
            index($0, head) == 1 { p = 1; next }
            p && index($0, "## [") == 1 { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # A tag with no CHANGELOG section still gets non-empty notes: GitHub
          # appends its own commit/PR list below whatever the body holds.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
